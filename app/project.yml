name: Blend
options:
  bundleIdPrefix: app.blend
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    # tools/build.sh and tools/release.sh set these from the VERSION file.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Where CMake put the engine library and the driver.
    BLEND_BUILD_DIR: $(SRCROOT)/../build
packages:
  # Updates: checks the appcast on the website and installs signed releases.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Blend:
    type: application
    platform: macOS
    sources:
      - path: Blend
        excludes: ["*.h", "*.entitlements", "*.sh"]
      # Run as root when the driver is installed or removed.
      - path: Blend/restart-audio.sh
        buildPhase: resources
      # Shipped inside the app, as the licenses of the included libraries require.
      - path: ../LICENSE
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: Blend/Info.plist
      properties:
        # The app is named Blend Mic, but the bundle stays Blend.app so the cask, updates and
        # existing installs keep finding it. macOS (Finder, Login Items, the permission
        # prompts) shows the name in en.lproj/InfoPlist.strings only while CFBundleDisplayName
        # here matches the bundle's file name, and the file name otherwise.
        CFBundleName: Blend Mic
        CFBundleDisplayName: Blend
        LSHasLocalizedDisplayName: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Free software under the MIT License.
        NSMicrophoneUsageDescription: Blend Mic mixes your microphone into the virtual microphones you create.
        NSAudioCaptureUsageDescription: Blend Mic captures audio from the apps you add to a mix.
        # A Worker that passes the Pages appcast through and counts update checks.
        SUFeedURL: https://apps.idea2prod.in/blend/appcast.xml
        # Updates must be signed with the matching private key, kept with the Developer ID.
        SUPublicEDKey: YLvPSGEaYiPsXphy/q9LCDGs2s0qp8hM2LVBIWbl78c=
        # Sparkle names the app in its dialogs from this key first, in every process it runs.
        SUBundleName: Blend Mic
    entitlements:
      path: Blend/Blend.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blend.Blend
        # Blend/AppIcon.icon is an Icon Composer icon. actool compiles it into Assets.car
        # for macOS 26 and an AppIcon.icns for macOS 15; XcodeGen types it wrapper.icon,
        # which Xcode still routes to actool.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Blend/Blend-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../engine/include
        LIBRARY_SEARCH_PATHS: $(BLEND_BUILD_DIR)/engine $(BLEND_BUILD_DIR)/webrtc/lib
        OTHER_LDFLAGS: -lBlendEngine -lwebrtc-apm -lc++
        # Ad hoc ("Sign to Run Locally") unless the build scripts pass an identity. The
        # hardened runtime is on so the same build can be notarized.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        # Debug builds otherwise put the code in a separate library, which the hardened
        # runtime refuses to load under a certificate without a team.
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Xcode otherwise adds the debugger entitlement to every build, and notarization
        # rejects an app that carries it.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    postBuildScripts:
      # The app carries the driver it was built with and installs it from Setup. The
      # driver is signed by its own CMake build; the app's signature then seals it.
      - name: Embed driver
        basedOnDependencyAnalysis: false
        script: |
          src="$BLEND_BUILD_DIR/driver/BlendDriver.driver"
          dst="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/PlugIns/BlendDriver.driver"
          if [ ! -d "$src" ]; then
            echo "error: $src is missing; build the driver with CMake first (tools/build.sh does both)"
            exit 1
          fi
          rm -rf "$dst"
          mkdir -p "$(dirname "$dst")"
          ditto "$src" "$dst"
    dependencies:
      - package: Sparkle
      - sdk: CoreAudio.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: AppKit.framework
      - sdk: ServiceManagement.framework
  # Swift tests of the app's pure logic. They compile the sources they test rather than
  # load Blend.app, so a test run never starts a second Blend beside the one in use.
  BlendTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BlendTests
      - path: Blend/MixStatus.swift
      - path: Blend/WhenIdle.swift
      - path: Blend/SupportItems.swift
      - path: Blend/StatusPolling.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blend.BlendTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: [BlendTests]
